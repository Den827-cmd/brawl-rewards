<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars Награды / Rewards</title>
    <style>
        html, body {
            width: 100vw !important;
            overflow-x: hidden !important;
            touch-action: pan-y !important;
            -webkit-text-size-adjust: 100% !important;
            margin: 0;
            padding: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #ffffff;
            padding: 15px;
        }

        /* Шапка с заголовком и переключателем */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 15px 0 25px 0;
        }

        h2 {
            text-align: center;
            color: #00ff88;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        /* Кнопка переключения языка */
        .lang-switch {
            background: #24344f;
            color: #fff;
            border: 1px solid #3b4e6b;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .lang-switch:hover {
            background: #3b4e6b;
            border-color: #00ff88;
        }

        /* Стиль для контейнера рекламы */
        .ad-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .rewards-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
            width: 100% !important;
        }

        .card {
            background: #161f30;
            border: 1px solid #24344f;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reward-img {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            object-fit: cover;
            background: #0f1622;
            border: 1px solid #3b4e6b;
        }

        .reward-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .reward-type {
            font-size: 0.8rem;
            color: #8fa0bc;
        }

        .btn-scan {
            background: #00ff88;
            color: #0b111e;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-scan:hover {
            background: #00cc6e;
        }

        .footer-note {
            text-align: center;
            color: #8fa0bc;
            font-size: 0.8rem;
            margin: 30px auto 20px auto;
            padding: 10px;
            max-width: 400px;
            animation: pulse 2s infinite ease-in-out;
            cursor: pointer;
            line-height: 1.4;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #161f30;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #00ff88;
            text-align: center;
            width: 300px;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #fff;
        }

        .qr-display {
            width: 220px;
            height: 220px;
            background: white;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-close {
            background: #24344f;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2 id="mainTitle">🎁 КАТАЛОГ НАГРАД BRAWL</h2>
        <button class="lang-switch" onclick="toggleLanguage()" id="langBtn">Language: EN</button>
    </div>

    <div class="ad-container">
        <script type="text/javascript">
            atOptions = {
                'key' : 'ec6619f5d799bef2560f565771225bd9',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/ec6619f5d799bef2560f565771225bd9/invoke.js"></script>
    </div>
    
    <div class="rewards-list" id="rewardsContainer"></div>

    <div class="footer-note" id="footerNote">
        На сайте представлены не все актуальные QR-коды, а также мы НЕ отвечаем за срок действия QR-кода.
    </div>

    <div class="modal-overlay" id="qrModal">
        <div class="modal-content">
            <h3 id="modalTitle">Название</h3>
            <div class="qr-display">
                <img id="qrImage" src="" alt="QR Code">
            </div>
            <button class="btn-close" id="btnClose" onclick="closeQR()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        // База данных наград на двух языках
        const rewardsData = [
            { id: 1, img: "13.jpg", qr: "13eenshot_20260529_185334_TikTok.jpg", name_ru: "Значок клоуна", name_en: "Clown Pin" },
            { id: 2, img: "12.jpg", qr: "12enshot_20260529_185349_TikTok.jpg", name_ru: "Яйцо годзиллы", name_en: "Godzilla Egg" },
            { id: 3, img: "11.jpg", qr: "11nshot_20260529_185405_TikTok.jpg", name_ru: "Спрэй пергамент", name_en: "Parchment Spray" },
            { id: 4, img: "10.jpg", qr: "10nshot_20260529_185420_TikTok.jpg", name_ru: "Иконка W", name_en: "W Icon" },
            { id: 5, img: "9.jpg",  qr: "999eenshot_20260529_185430_TikTok.jpg", name_ru: "Синий значок", name_en: "Blue Pin" },
            { id: 6, img: "8.jpg",  qr: "888eenshot_20260529_185437_TikTok.jpg", name_ru: "Взрывной мозг", name_en: "Exploding Brain" },
            { id: 7, img: "7.jpg",  qr: "7777enshot_20260529_185445_TikTok.jpg", name_ru: "Иконка пиццы", name_en: "Pizza Icon" },
            { id: 8, img: "6.jpg",  qr: "666reenshot_20260529_185453_TikTok.jpg", name_ru: "Иконка Годзиллы", name_en: "Godzilla Icon" },
            { id: 9, img: "5.jpg",  qr: "5555enshot_20260529_185503_TikTok.jpg", name_ru: "Иконка старый бравл", name_en: "Old Brawl Icon" },
            { id: 10, img: "4.jpg", qr: "44eenshot_20260529_185939_TikTok.jpg", name_ru: "Значок Серый клоун", name_en: "Gray Clown Pin" },
            { id: 11, img: "3.jpg", qr: "3Screenshot_20260529_185950_TikTok.jpg", name_ru: "Желтый значок со спреем", name_en: "Yellow Spray Pin" },
            { id: 12, img: "2.jpg", qr: "2Screenshot_20260529_190003_TikTok.jpg", name_ru: "Значок злой лампочки", name_en: "Angry Lightbulb Pin" },
            { id: 13, img: "1.jpg", qr: "1Screenshot_20260529_190014_TikTok.jpg", name_ru: "Иконка спайка \"окей\"", name_en: "Spike \"OK\" Icon" }
        ];

        // Текстовые переводы интерфейса
        const translations = {
            ru: {
                title: "🎁 КАТАЛОГ НАГРАД BRAWL",
                rewardType: "Награда",
                btnScan: "ОТКРЫТЬ QR",
                btnClose: "ЗАКРЫТЬ",
                footer: "На сайте представлены не все актуальные QR-коды, а также мы НЕ отвечаем за срок действия QR-кода.",
                langBtn: "Language: EN"
            },
            en: {
                title: "🎁 BRAWL REWARDS CATALOG",
                rewardType: "Reward",
                btnScan: "OPEN QR",
                btnClose: "CLOSE",
                footer: "The site does not feature all current QR codes, and we are NOT responsible for the expiration date of the QR codes.",
                langBtn: "Язык: RU"
            }
        };

        let currentLang = 'ru'; // Язык по умолчанию

        // Функция рендеринга списка карточек
        function renderCards() {
            const container = document.getElementById('rewardsContainer');
            container.innerHTML = ''; // Очищаем список перед новой отрисовкой

            rewardsData.forEach(item => {
                const name = currentLang === 'ru' ? item.name_ru : item.name_en;
                const typeText = currentLang === 'ru' ? `${translations.ru.rewardType} #${item.id}` : `${translations.en.rewardType} #${item.id}`;
                const btnText = translations[currentLang].btnScan;

                const cardHtml = `
                    <div class="card">
                        <div class="card-info">
                            <img src="${item.img}" class="reward-img" alt="Reward">
                            <div>
                                <div class="reward-name">${name}</div>
                                <div class="reward-type">${typeText}</div>
                            </div>
                        </div>
                        <button class="btn-scan" onclick="openQR('${name.replace(/'/g, "\\'")}', '${item.qr}')">${btnText}</button>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Функция перевода статического текста страницы
        function updateInterfaceText() {
            document.getElementById('mainTitle').innerText = translations[currentLang].title;
            document.getElementById('footerNote').innerText = translations[currentLang].footer;
            document.getElementById('langBtn').innerText = translations[currentLang].langBtn;
            document.getElementById('btnClose').innerText = translations[currentLang].btnClose;
        }

        // Переключатель языка
        function toggleLanguage() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            updateInterfaceText();
            renderCards();
        }

        // Функции модального окна
        function openQR(title, qrFile) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('qrImage').src = qrFile;
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQR() {
            document.getElementById('qrModal').classList.remove('active');
        }

        // Первичная инициализация страницы при загрузке
        updateInterfaceText();
        renderCards();
    </script>

</body>
</html>
